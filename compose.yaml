name: notarobot

services:
  notarobot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TWOCAP_IMAGE:-notarobot:local}
    command: ["mcp"]
    restart: unless-stopped
    environment:
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:?TWOCAPTCHA_API_KEY is required}
      TWOCAPTCHAMCP_ADDRESS: 0.0.0.0:8080
      TWOCAPTCHAMCP_TOKEN: ${TWOCAPTCHAMCP_TOKEN:?TWOCAPTCHAMCP_TOKEN is required}
    x-ports:
      - ${TWOCAP_DOMAIN:-notabot.aresa.me}:8080/https
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6
