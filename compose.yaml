name: notarobot

services:
  notarobot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TWOCAP_IMAGE:-notarobot:local}
    command: ["mcp"]
    restart: unless-stopped
    environment:
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:?TWOCAPTCHA_API_KEY is required}
      TWOCAPTCHAMCP_ADDRESS: 0.0.0.0:8080
      TWOCAPTCHAMCP_TOKEN: ${TWOCAPTCHAMCP_TOKEN:?TWOCAPTCHAMCP_TOKEN is required}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6

  notarobot-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - notarobot
    environment:
      CADDY_HTTP_PORT: "8080"
      TWOCAPTCHAMCP_TOKEN: ${TWOCAPTCHAMCP_TOKEN:?TWOCAPTCHAMCP_TOKEN is required}
      TWOCAP_BASIC_AUTH_USER: ${TWOCAP_BASIC_AUTH_USER:?TWOCAP_BASIC_AUTH_USER is required}
      TWOCAP_BASIC_AUTH_HASH: ${TWOCAP_BASIC_AUTH_HASH:?TWOCAP_BASIC_AUTH_HASH is required}
    ports:
      - target: 8080
        published: ${TWOCAP_HTTP_PORT:-8080}
        protocol: tcp
        mode: host
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data

configs:
  caddyfile:
    file: ./Caddyfile

volumes:
  caddy-data:
